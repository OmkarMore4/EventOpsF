# This file is NOT a Python package definition — EventOps is still installed
# via requirements.txt (pip install -r requirements.txt), locally and on
# Render alike. The only thing read from here is [tool.vercel.scripts.build],
# which Vercel's zero-config Flask builder runs before deploying. See
# build_static.py and README.md > "Deploying to production > Vercel".

[tool.vercel.scripts]
build = "python build_static.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
