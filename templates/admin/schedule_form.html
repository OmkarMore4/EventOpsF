{% extends "base.html" %}
{% block title %}{{ 'Edit schedule item' if item else 'Add schedule item' }} · {{ app_name }}{% endblock %}
{% block page_title %}{{ 'Edit schedule item' if item else 'Add schedule item' }}{% endblock %}

{% block content %}
{% set v = values or {} %}
<form method="POST" class="max-w-xl">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="card-hero space-y-4">
    <div>
      <label class="label-field" for="title">Title</label>
      <input class="input-field" type="text" id="title" name="title" required value="{{ v.get('title', '') }}" placeholder="e.g. Opening Ceremony">
    </div>
    <div class="grid sm:grid-cols-3 gap-4">
      <div>
        <label class="label-field" for="date">Date</label>
        <input class="input-field" type="date" id="date" name="date" required value="{{ v.get('date', '') }}" min="{{ event.start_date }}" max="{{ event.end_date }}">
      </div>
      <div>
        <label class="label-field" for="start_time">Start time</label>
        <input class="input-field" type="time" id="start_time" name="start_time" required value="{{ v.get('start_time', '') }}">
      </div>
      <div>
        <label class="label-field" for="end_time">End time</label>
        <input class="input-field" type="time" id="end_time" name="end_time" value="{{ v.get('end_time', '') }}">
      </div>
    </div>
    <div class="grid sm:grid-cols-2 gap-4">
      <div>
        <label class="label-field" for="venue">Location</label>
        <input class="input-field" type="text" id="venue" name="venue" value="{{ v.get('venue', '') }}" placeholder="e.g. Main Auditorium">
      </div>
      <div>
        <label class="label-field" for="type">Type</label>
        <select class="select-field" id="type" name="type">
          {% for t in ['Session', 'Briefing', 'Break', 'Meal', 'Other'] %}
          <option value="{{ t }}" {{ 'selected' if v.get('type', 'Session') == t else '' }}>{{ t }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div>
      <label class="label-field" for="description">Notes (optional)</label>
      <textarea class="textarea-field" id="description" name="description" rows="2">{{ v.get('description', '') }}</textarea>
    </div>
  </div>
  <div class="flex items-center gap-3 mt-5">
    <button type="submit" class="btn-primary">{{ 'Save changes' if item else 'Add to schedule' }}</button>
    <a href="{{ url_for('admin.schedule_list') }}" class="btn-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
