{% macro icon(name, class='w-5 h-5') %}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="{{ class }}">
{%- if name == 'dashboard' %}
  <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
  <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
{%- elif name == 'events' %}
  <rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/>
  <line x1="7" y1="2" x2="7" y2="6"/><line x1="17" y1="2" x2="17" y2="6"/>
{%- elif name == 'volunteers' %}
  <circle cx="8.5" cy="7.5" r="3"/><path d="M3 20 L4.5 14.5 L12.5 14.5 L14 20 Z"/>
  <circle cx="17" cy="8.5" r="2.4"/><path d="M13.5 20 L14.8 15.5 L20.5 15.5 L21 20 Z" opacity="0.55"/>
{%- elif name == 'tasks' %}
  <rect x="5" y="4" width="14" height="17" rx="1.5"/><rect x="9" y="2" width="6" height="3" rx="1"/>
  <line x1="8" y1="11.5" x2="16" y2="11.5"/><line x1="8" y1="15" x2="16" y2="15"/><line x1="8" y1="18.5" x2="13" y2="18.5"/>
{%- elif name == 'attendance' %}
  <circle cx="12" cy="9" r="5"/><path d="M8 12.5 L12 21 L16 12.5 Z"/>
  <circle cx="12" cy="9" r="1.8" fill="currentColor" stroke="none"/>
{%- elif name == 'equipment' %}
  <rect x="3" y="9" width="18" height="11" rx="1.5"/><path d="M9 9 L9 6 L15 6 L15 9"/><line x1="3" y1="14" x2="21" y2="14"/>
{%- elif name == 'schedule' %}
  <circle cx="12" cy="12" r="8.5"/><line x1="12" y1="12" x2="12" y2="7"/><line x1="12" y1="12" x2="15.5" y2="14"/>
{%- elif name == 'issues' %}
  <path d="M12 3.5 L21.5 20 L2.5 20 Z"/><line x1="12" y1="9.5" x2="12" y2="14.5"/>
  <circle cx="12" cy="17.3" r="0.9" fill="currentColor" stroke="none"/>
{%- elif name == 'notifications' %}
  <path d="M7 17 L7 10 L9 5 H15 L17 10 V17 L19 19 H5 Z"/><line x1="12" y1="3" x2="12" y2="5"/>
  <circle cx="12" cy="20.3" r="1" fill="currentColor" stroke="none"/>
{%- elif name == 'reports' %}
  <line x1="3" y1="21" x2="21" y2="21"/><rect x="5" y="13" width="4" height="8"/>
  <rect x="10.5" y="8" width="4" height="13"/><rect x="16" y="4" width="4" height="17"/>
{%- elif name == 'logout' %}
  <rect x="4" y="4" width="7" height="16" rx="1"/><line x1="21" y1="12" x2="10.5" y2="12"/><polyline points="17,8 21,12 17,16"/>
{%- elif name == 'menu' %}
  <line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/>
{%- elif name == 'close' %}
  <line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>
{%- elif name == 'gps' %}
  <circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/>
  <line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/>
{%- elif name == 'plus' %}
  <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
{%- elif name == 'edit' %}
  <path d="M4 20 L4 16.5 L15 5.5 L18.5 9 L7.5 20 Z"/><line x1="13" y1="7.5" x2="16.5" y2="11"/>
{%- elif name == 'trash' %}
  <rect x="6" y="8" width="12" height="12" rx="1"/><line x1="4" y1="8" x2="20" y2="8"/>
  <path d="M9 8 L9.5 5 L14.5 5 L15 8"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>
{%- elif name == 'profile' %}
  <circle cx="12" cy="12" r="9"/><circle cx="12" cy="9.8" r="2.6"/><path d="M6 18.5 L7.5 14.5 L16.5 14.5 L18 18.5"/>
{%- elif name == 'check' %}
  <polyline points="4,12.5 9,17.5 20,6"/>
{%- elif name == 'alert' %}
  <circle cx="12" cy="12" r="9"/><line x1="12" y1="7.5" x2="12" y2="13"/><circle cx="12" cy="16.3" r="0.9" fill="currentColor" stroke="none"/>
{%- elif name == 'info' %}
  <circle cx="12" cy="12" r="9"/><line x1="12" y1="10.5" x2="12" y2="16.5"/><circle cx="12" cy="7.3" r="0.9" fill="currentColor" stroke="none"/>
{%- elif name == 'download' %}
  <path d="M12 3 V15"/><polyline points="7,10 12,15 17,10"/><line x1="4" y1="20" x2="20" y2="20"/>
{%- elif name == 'chevron-down' %}
  <polyline points="6,9 12,15 18,9"/>
{%- endif %}
</svg>
{% endmacro %}
