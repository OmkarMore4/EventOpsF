<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{{ app_name }}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#14171C',
          paper: '#F6F4EF',
          signal: { DEFAULT: '#D97706', dark: '#B45309', light: '#FDF3E7' },
        },
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          display: ['"Space Grotesk"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
        },
      },
    },
  }
</script>
<style type="text/tailwindcss">
  @layer components {
    .input-field { @apply w-full rounded-lg border border-ink/15 px-3.5 py-2.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-signal/40 focus:border-signal placeholder:text-ink/30; }
    .btn-primary { @apply inline-flex items-center justify-center gap-2 bg-signal hover:bg-signal-dark text-white font-semibold text-sm rounded-lg px-4 py-2.5 transition-colors disabled:opacity-50 disabled:cursor-not-allowed; }
  }
</style>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="h-full bg-ink font-sans antialiased">
{% block guest_content %}{% endblock %}
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
